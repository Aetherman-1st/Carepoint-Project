<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log in | CarePoint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23FFFFFF'/%3E%3Cpath d='M12 5h8v7h7v8h-7v7h-8v-7H5v-8h7z' fill='%23D62828'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/motion.css">
  <link rel="stylesheet" href="/chatbot.css">
  <script src="/motion.js" defer></script>
  <script src="/chatbot.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>CarePoint</span>
      </a>
      <nav class="site-nav" id="siteNav" aria-label="Main navigation">
        <a href="/clinics">Clinics</a>
        <a href="/services">Services</a>
        <a href="/how-it-works">How it works</a>
        <a href="/contact">Contact</a>
      </nav>
      <div class="header-actions" id="headerActions">
        <a class="btn btn-outline btn-sm" href="/signup">Create account</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteNav">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main class="auth-main">
    <div class="container">
      <div class="auth-panel">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>CarePoint</span>
        </a>

        <div class="auth-heading">
          <h1 id="authTitle">Log in</h1>
          <p id="authSubtitle">Book and manage your appointments.</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" autocomplete="email" autofocus required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-row">
              <input type="password" id="password" autocomplete="current-password" required>
              <button type="button" id="toggleBtn">Show</button>
            </div>
          </div>
          <p id="error" class="auth-error" role="alert"></p>
          <button type="submit" id="loginBtn" class="btn btn-primary">Log in</button>
        </form>

        <form id="twoFactorForm" class="auth-form hidden" novalidate>
          <p class="code-sent" id="codeSent">Enter the 6-digit code for your email.</p>
          <div class="field">
            <label for="codeInput">Verification code</label>
            <input type="text" id="codeInput" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="devCodeNote">
          </div>
          <p id="codeError" class="auth-error" role="alert"></p>
          <p id="codeStatus" class="form-status" role="status"></p>
          <p id="devCodeNote" class="dev-note hidden"></p>
          <button type="submit" id="verifyBtn" class="btn btn-primary">Verify and log in</button>
          <div class="auth-links">
            <button type="button" id="resendBtn" class="link-btn">Resend code</button>
            <button type="button" id="backBtn" class="link-btn">Use a different account</button>
          </div>
        </form>

        <p class="auth-alt" id="authAlt">No account? <a href="/signup">Create one</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>CarePoint</span>
        </a>
        <p>Book and manage clinic appointments online.</p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="/clinics">Clinics</a>
        <a href="/services">Services</a>
        <a href="/how-it-works">How it works</a>
        <a href="/contact">Contact</a>
        <a href="/signup">Create account</a>
      </nav>
    </div>
  </footer>

  <script src="/ui.js"></script>
  <script src="/script.js"></script>
</body>
</html>
