<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset admin password | CarePoint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23FFFFFF'/%3E%3Cpath d='M12 5h8v7h7v8h-7v7h-8v-7H5v-8h7z' fill='%23D62828'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./motion.css">
  <link rel="stylesheet" href="./edge-theme.css">
</head>
<body>
  <main class="auth-main">
    <div class="container">
      <div class="auth-panel">
        <a class="brand" href="https://carepoint-15l.pages.dev">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>CarePoint Admin</span>
        </a>
        <div class="auth-heading">
          <h1>Reset password</h1>
          <p>Enter your administrator email. If an account exists, Supabase will send a reset link.</p>
        </div>
        <form id="forgotForm" class="auth-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" autocomplete="email" autofocus required>
          </div>
          <p id="message" class="form-status" role="status"></p>
          <button type="submit" id="submitBtn" class="btn btn-primary">Send reset link</button>
        </form>
        <p class="auth-alt"><a href="./">Back to admin login</a></p>
      </div>
    </div>
  </main>
  <script src="./config.js"></script>
  <script src="./supabase.js"></script>
  <script src="./forgot-password.js"></script>
</body>
</html>
